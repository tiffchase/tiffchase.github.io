<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>tiffany chase</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================
           GENERAL
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "DM Sans", sans-serif;
            background: #ffdce9;
            color: #222;
            display: flex;
            justify-content: center;
            padding: 45px 20px;
            overflow-x: hidden;
        }

        /* =========================
           DECORATIVE SPARKLES
        ========================= */

        .sparkle {
            position: fixed;
            color: #81d8d0;
            font-size: 20px;
            pointer-events: none;
            z-index: 0;
        }

        .sparkle.one {
            top: 12%;
            left: 12%;
        }

        .sparkle.two {
            top: 22%;
            right: 13%;
        }

        .sparkle.three {
            bottom: 15%;
            left: 15%;
        }

        .sparkle.four {
            bottom: 25%;
            right: 12%;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            max-width: 560px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* =========================
           PROFILE PICTURE
        ========================= */

        .profile-picture {
            width: 125px;
            height: 125px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center;
            display: block;
            margin: 0 auto 18px auto;

            border: 5px solid white;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.10);
        }

        /* =========================
           NAME
        ========================= */

        h1 {
            font-family: "Playfair Display", serif;
            font-size: 38px;
            font-weight: 600;
            letter-spacing: -1px;
            margin-bottom: 5px;
        }

        /* =========================
           USERNAME
        ========================= */

        .username {
            color: #666;
            font-size: 15px;
            margin-bottom: 12px;
        }

        /* =========================
           BIO
        ========================= */

        .bio {
            font-size: 14px;
            color: #555;
            margin-bottom: 28px;
        }

        /* =========================
           LINK BUTTONS
        ========================= */

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 62px;
            padding: 17px 50px;

            background: rgba(255, 255, 255, 0.92);
            color: #222;

            text-decoration: none;

            border-radius: 18px;

            font-size: 15px;
            font-weight: 600;

            border: 1px solid rgba(255, 255, 255, 0.8);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.07);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        .link:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 25px rgba(0, 0, 0, 0.11);

            background: #ffffff;
        }

        .link:active {
            transform: scale(0.98);
        }

        .link span {
            margin-right: 8px;
        }

        /* =========================
           SOCIAL ICON BUTTONS
        ========================= */

        .socials {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 14px;

            margin-top: 28px;
        }

        .social {
            width: 55px;
            height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;
            color: #222;

            border-radius: 50%;

            text-decoration: none;

            box-shadow:
                0 5px 15px rgba(0, 0, 0, 0.08);

            transition: 0.25s ease;
        }

        .social svg {
            width: 24px;
            height: 24px;

            fill: currentColor;
        }

        .social:hover {
            background: #81d8d0;
            color: white;

            transform: translateY(-4px);

            box-shadow:
                0 8px 18px rgba(0, 0, 0, 0.12);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            margin-top: 30px;
            font-size: 11px;
            color: #777;
        }

        /* =========================
           MOBILE DESIGN
        ========================= */

        @media (max-width: 600px) {

            body {
                padding: 35px 18px;
            }

            .container {
                max-width: 430px;
            }

            .profile-picture {
                width: 110px;
                height: 110px;
            }

            h1 {
                font-size: 34px;
            }

            .link {
                min-height: 58px;
            }

            .sparkle {
                opacity: 0.5;
            }

            .social {
                width: 50px;
                height: 50px;
            }

        }

    </style>

</head>
